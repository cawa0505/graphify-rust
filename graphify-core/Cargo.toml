[package]
name = "graphify-core"
version = "2.1.0"
edition = "2024"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Graph processing
petgraph = { version = "0.6", features = ["serde-1"] }
rayon = "1.10"

# AST Parsers
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-java = "0.23"
tree-sitter-swift = "0.7"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
