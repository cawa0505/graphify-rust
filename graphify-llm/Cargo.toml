[package]
name = "graphify-llm"
version = "2.0.0-beta.1"
edition = "2024"

[dependencies]
graphify-core = { path = "../graphify-core" }
graphify-memory = { path = "../graphify-memory" }

# Async / HTTP
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
