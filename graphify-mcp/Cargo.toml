[package]
name = "graphify-mcp"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "graphify-mcp"
path = "src/main.rs"

[dependencies]
graphify-core = { path = "../graphify-core" }
graphify-memory = { path = "../graphify-memory" }
graphify-llm = { path = "../graphify-llm" }
graphify-registry = { path = "../graphify-registry" }
# 第一方內嵌 plugin：relay* 工具（GraphifyPlugins 群組，靜態連結）
graphify-plugin-handoff = { path = "../../GraphifyPlugins/graphify-plugin-handoff" }
# 第一方內嵌 plugin：opendoc* 檔案↔程式碼追蹤工具
graphify-plugin-opendoc = { path = "../../GraphifyPlugins/graphify-plugin-opendoc" }
# 第一方內嵌 plugin：review* code-review-graph 橋接工具
graphify-plugin-review = { path = "../../GraphifyPlugins/graphify-plugin-review" }
# 第一方內嵌 plugin：telemetry* Draco Telemetry 橋接工具
graphify-plugin-telemetry = { path = "../../GraphifyPlugins/graphify-plugin-telemetry" }

# Async / IO
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
petgraph = { version = "0.6", features = ["serde-1"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
