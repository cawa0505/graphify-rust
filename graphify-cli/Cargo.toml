[package]
name = "graphify-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "graphify"
path = "src/main.rs"

[dependencies]
graphify-core = { path = "../graphify-core" }
graphify-memory = { path = "../graphify-memory" }
graphify-llm = { path = "../graphify-llm" }
graphify-registry = { path = "../graphify-registry" }
# 第一方內嵌 plugin（GraphifyPlugins 群組，靜態連結；公開建置需同名相對路徑存在）
graphify-plugin-handoff = { path = "../../GraphifyPlugins/graphify-plugin-handoff" }
graphify-plugin-opendoc = { path = "../../GraphifyPlugins/graphify-plugin-opendoc" }
# 第一方內嵌 plugin：review* code-review-graph 橋接工具
graphify-plugin-review = { path = "../../GraphifyPlugins/graphify-plugin-review" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rayon = "1.10"
ratatui = "0.28"
crossterm = "0.28"
sha2 = "0.10"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12" }
qdrant-client = { version = "1.19", default-features = false, features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
