[package]
name = "graphify-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "graphify"
path = "src/main.rs"

[dependencies]
graphify-core = { path = "../graphify-core" }
graphify-llm = { path = "../graphify-llm" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rayon = "1.10"
ratatui = "0.28"
crossterm = "0.28"
sha2 = "0.10"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12" }

[lints]
workspace = true
