name: Release

# 推送 v* tag 時自動建置並發佈 GitHub Release（附 Linux x86_64 binary）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 第一方內嵌 plugin 以 ../../GraphifyPlugins path dependency 靜態連結，
      # CI 需將其 clone 到 workspace 的同層位置（與本機開發目錄結構一致）
      - name: Checkout GraphifyPlugins (path dependency)
        uses: actions/checkout@v4
        with:
          repository: cawa0505/graphify-plugins
          ref: main
          path: GraphifyPlugins

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p graphify-cli

      - name: Run tests
        run: cargo test --workspace

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/graphify "dist/graphify-${GITHUB_REF_NAME}-x86_64-linux"
          cd dist
          sha256sum "graphify-${GITHUB_REF_NAME}-x86_64-linux" > "graphify-${GITHUB_REF_NAME}-x86_64-linux.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/graphify-*
