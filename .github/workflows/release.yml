name: Release

# 推送 v* tag 時自動建置並發佈 GitHub Release（附 Linux x86_64 binary）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: GraphifyRust

      - name: Clone GraphifyPlugins
        run: |
          git clone --depth 1 https://github.com/cawa0505/graphify-plugins.git GraphifyPlugins

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            GraphifyRust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('GraphifyRust/Cargo.lock') }}

      - name: Build release binary
        working-directory: GraphifyRust
        run: cargo build --release -p graphify-cli

      - name: Run tests
        working-directory: GraphifyRust
        run: cargo test --workspace

      - name: Package
        working-directory: GraphifyRust
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/graphify "dist/graphify-${GITHUB_REF_NAME}-x86_64-linux"
          cd dist
          sha256sum "graphify-${GITHUB_REF_NAME}-x86_64-linux" > "graphify-${GITHUB_REF_NAME}-x86_64-linux.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GraphifyRust/dist/graphify-*
